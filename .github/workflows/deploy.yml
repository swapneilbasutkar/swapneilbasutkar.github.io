name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue them instead of cancelling, so the
# last push always ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The deploy is gated on these: a broken build never reaches the site.
      # They run against a clean checkout, so nothing may depend on artefacts
      # from a previous build.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # Both values are derived here rather than taken straight from the action,
      # so the build does not silently lose its site URL if that output ever
      # changes name. A custom domain, which the action does know about, still
      # wins when it reports one.
      - name: Derive base path and site URL
        id: site
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          owner_lc=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          repo="${GITHUB_REPOSITORY#*/}"
          repo_lc=$(echo "$repo" | tr '[:upper:]' '[:lower:]')

          if [ "$repo_lc" = "${owner_lc}.github.io" ]; then
            base_path=""
            fallback_url="https://${owner_lc}.github.io"
          else
            base_path="/$repo"
            fallback_url="https://${owner_lc}.github.io/$repo"
          fi

          site_url="${PAGES_BASE_URL:-$fallback_url}"

          echo "base_path=$base_path" >> "$GITHUB_OUTPUT"
          echo "site_url=$site_url"   >> "$GITHUB_OUTPUT"
          echo "base path: '${base_path:-<root>}'"
          echo "site URL : $site_url"

      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.site.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.site_url }}
        run: npm run build:static

      # Belt and braces: stops Jekyll from ever stripping the _next/ directory.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      # Catches a broken export before it goes live.
      - name: Smoke-test the export
        run: |
          test -f out/index.html
          test -f out/opengraph-image.png
          test -f out/resume/Swapneil_Basutkar_Resume.pdf
          grep -q "I turn enterprise problems into deployed software" out/index.html
          echo "export looks good"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
